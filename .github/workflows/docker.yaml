name: Custom Docker build

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the custom image to this repository owner's GHCR
        type: boolean
        default: false

jobs:
  docker_build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR for explicit publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build custom image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.image.outputs.name }}:custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
